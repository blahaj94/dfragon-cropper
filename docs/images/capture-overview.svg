<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">한 프레임에서 여러 영역을 PNG로 저장하는 DFragonCropper</title>
  <desc id="desc">주 모니터의 같은 원본 프레임 안에 초록색 ROI 1과 주황색 ROI 2가 있습니다. PrintScreen 한 번으로 각 영역을 크기와 픽셀을 바꾸지 않고 별도의 PNG에 저장합니다. 실제 앱 화면이 아닌 개념도입니다.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e6ecf3" stroke-width="1"/>
    </pattern>
    <marker id="green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#258163"/>
    </marker>
    <marker id="amber-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b77720"/>
    </marker>
    <g id="region-one">
      <rect width="210" height="84" fill="#e6f4ee"/>
      <rect x="16" y="15" width="88" height="7" rx="3" fill="#79a995"/>
      <rect x="16" y="38" width="112" height="30" rx="4" fill="#256e57"/>
      <path d="M143 61L158 48L170 53L193 31" fill="none" stroke="#258163" stroke-width="4"/>
      <circle cx="193" cy="31" r="4" fill="#258163"/>
    </g>
    <g id="region-two">
      <rect width="180" height="104" fill="#fff1d8"/>
      <rect x="14" y="15" width="96" height="7" rx="3" fill="#c59e5f"/>
      <path d="M14 35H166M14 58H166M14 81H166M77 35V94M131 35V94" fill="none" stroke="#e1c99e"/>
      <path d="M22 46H57M89 46H117M143 46H158M22 69H57M89 69H117M143 69H158M22 92H57M89 92H117M143 92H158" fill="none" stroke="#a37428" stroke-width="5"/>
    </g>
  </defs>
  <rect width="1280" height="660" rx="24" fill="#f5f8fc"/>
  <g font-family="'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif">
    <text x="52" y="48" font-size="14" font-weight="700" letter-spacing="2" fill="#52657e">DFRAGONCROPPER</text>
    <text x="52" y="101" font-size="38" font-weight="700" fill="#172d48">한 프레임에서, 필요한 영역만.</text>
    <text x="52" y="137" font-size="20" fill="#53657d">영역은 미리 저장하고, 캡처는 키 한 번으로.</text>

    <rect x="1003" y="44" width="225" height="76" rx="14" fill="#dce5f0"/>
    <rect x="1003" y="38" width="225" height="76" rx="14" fill="#ffffff" stroke="#cad5e3"/>
    <text x="1115" y="72" text-anchor="middle" font-size="23" font-weight="700" fill="#243e5e">PrintScreen</text>
    <text x="1115" y="98" text-anchor="middle" font-size="15" fill="#697c94">한 번의 캡처</text>

    <text x="52" y="181" font-size="17" font-weight="600" fill="#53657d">주 모니터 · 하나의 원본 프레임</text>
    <rect x="52" y="200" width="646" height="346" rx="14" fill="#ffffff" stroke="#bfccdd" stroke-width="2"/>
    <path d="M66 200H684Q698 200 698 214V236H52V214Q52 200 66 200Z" fill="#e9eef5"/>
    <circle cx="73" cy="218" r="4" fill="#9aaec6"/>
    <circle cx="88" cy="218" r="4" fill="#9aaec6"/>
    <circle cx="103" cy="218" r="4" fill="#9aaec6"/>
    <rect x="70" y="250" width="610" height="278" fill="url(#grid)"/>
    <rect x="336" y="265" width="318" height="48" rx="6" fill="#eaf0f6"/>
    <rect x="354" y="280" width="133" height="8" rx="4" fill="#c5d1df"/>
    <rect x="354" y="295" width="235" height="5" rx="2" fill="#d3dde8"/>
    <rect x="94" y="397" width="221" height="97" rx="6" fill="#eaf0f6"/>
    <path d="M112 422H277M112 442H259M112 462H285M112 482H203" fill="none" stroke="#c9d5e3" stroke-width="7"/>

    <use href="#region-one" x="96" y="278"/>
    <rect x="95" y="277" width="212" height="86" fill="none" stroke="#258163" stroke-width="3"/>
    <rect x="95" y="248" width="66" height="28" rx="5" fill="#258163"/>
    <text x="128" y="267" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ROI 1</text>
    <use href="#region-two" x="390" y="400"/>
    <rect x="389" y="399" width="182" height="106" fill="none" stroke="#b77720" stroke-width="3"/>
    <rect x="389" y="370" width="66" height="28" rx="5" fill="#b77720"/>
    <text x="422" y="389" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ROI 2</text>

    <path d="M308 340H734Q750 340 750 324V289Q750 277 766 277H921" fill="none" stroke="#258163" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#green-arrow)"/>
    <path d="M572 452H921" fill="none" stroke="#b77720" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#amber-arrow)"/>
    <rect x="732" y="361" width="161" height="45" rx="22" fill="#e5edf6"/>
    <text x="812" y="390" text-anchor="middle" font-size="17" font-weight="600" fill="#455f7d">픽셀 그대로 복사</text>

    <text x="937" y="181" font-size="17" font-weight="600" fill="#53657d">영역마다 독립된 PNG</text>
    <rect x="938" y="200" width="290" height="161" rx="12" fill="#ffffff" stroke="#afd2c3" stroke-width="2"/>
    <text x="959" y="230" font-size="17" font-weight="700" fill="#256e57">ROI 1 · PNG</text>
    <use href="#region-one" x="978" y="249"/>
    <rect x="938" y="381" width="290" height="165" rx="12" fill="#ffffff" stroke="#e2c48f" stroke-width="2"/>
    <text x="959" y="412" font-size="17" font-weight="700" fill="#9e6b1f">ROI 2 · PNG</text>
    <use href="#region-two" x="993" y="427"/>

    <path d="M52 576H1228" stroke="#d8e2ed"/>
    <circle cx="66" cy="615" r="14" fill="#e2eaf4"/>
    <text x="66" y="620" text-anchor="middle" font-size="14" font-weight="700" fill="#355171">1</text>
    <text x="93" y="621" font-size="19" fill="#355171">프로필에 영역 저장</text>
    <circle cx="471" cy="615" r="14" fill="#e2eaf4"/>
    <text x="471" y="620" text-anchor="middle" font-size="14" font-weight="700" fill="#355171">2</text>
    <text x="498" y="621" font-size="19" fill="#355171">같은 순간의 화면 캡처</text>
    <circle cx="903" cy="615" r="14" fill="#e2eaf4"/>
    <text x="903" y="620" text-anchor="middle" font-size="14" font-weight="700" fill="#355171">3</text>
    <text x="930" y="621" font-size="19" fill="#355171">내 PC에 PNG 저장</text>
  </g>
</svg>
