appId: io.github.blahaj94.dfragon-cropper
productName: DFragonCropper
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
  - '!**/{.env,.env.*,.npmrc,*.pem,*.key,*.pfx,*.p12}'
extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - icon.ico
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/koffi-win32-*/**
win:
  executableName: DFragonCropper
  icon: resources/icon.ico
  target:
    - target: portable
      arch: [x64]
portable:
  # In builder 26.15.3, true uses a unique extraction folder for every launch.
  # A shared folder cannot be replaced while its first Electron process is running.
  unpackDirName: true
  artifactName: ${productName}-${version}-${arch}-portable.${ext}
npmRebuild: false
publish: null
