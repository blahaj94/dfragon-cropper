name: Windows

on:
  pull_request:
  push:
    branches:
      - codex/initial-windows-capture-spike
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Check and build Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate package and release version
        id: metadata
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
            throw 'package.json must have a valid release version without build metadata.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -cne "v$version") {
              throw 'The tag must exactly match v<package.json version>.'
            }
            $notes = "docs/releases/$version.md"
            if (!(Test-Path -LiteralPath $notes -PathType Leaf) -or
                [string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) {
              throw "Release notes are required at $notes."
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          architecture: x64
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Test pixel and data contracts
        run: npm test

      # Real Electron UI with synthetic frames; not native PrintScreen, DPI or cursor evidence.
      - name: Test Electron UI with synthetic capture fixtures
        run: npm run test:ui

      - name: Build unsigned portable executable
        run: npm run build:win

      - name: Create executable checksum
        env:
          APP_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $fileName = "DFragonCropper-$env:APP_VERSION-x64-portable.exe"
          $executable = Join-Path 'dist' $fileName
          $hash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $fileName" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding utf8NoBOM

      - name: Upload portable executable and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: DFragonCropper-${{ steps.metadata.outputs.version }}-windows-x64
          path: |
            dist/DFragonCropper-${{ steps.metadata.outputs.version }}-x64-portable.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish version tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this run's verified build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: DFragonCropper-${{ needs.build.outputs.version }}-windows-x64
          path: dist

      - name: Verify checksum and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          if ($env:GITHUB_REF_NAME -cne "v$env:APP_VERSION") {
            throw 'Release tag and checked build version differ.'
          }
          $fileName = "DFragonCropper-$env:APP_VERSION-x64-portable.exe"
          $executable = Join-Path 'dist' $fileName
          $hash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = (Get-Content -LiteralPath 'dist/SHA256SUMS.txt' -Raw).TrimEnd()
          if ($checksum -cne "$hash  $fileName") {
            throw 'The downloaded executable does not match SHA256SUMS.txt.'
          }
          $releaseArguments = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            $executable, 'dist/SHA256SUMS.txt',
            '--verify-tag', '--title', "DFragonCropper $env:APP_VERSION",
            '--notes-file', "docs/releases/$env:APP_VERSION.md"
          )
          if ($env:APP_VERSION.StartsWith('0.') -or $env:APP_VERSION.Contains('-')) {
            $releaseArguments += @('--prerelease', '--latest=false')
          }
          # Existing releases are never overwritten by a workflow rerun.
          gh @releaseArguments
